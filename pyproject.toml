[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algoritmos-consulta"
version = "0.1.0"
description = "Deutsch, Deutsch-Jozsa, Bernstein-Vazirani e Simon em Qiskit"
requires-python = ">=3.10"
dependencies = ["qiskit>=2.0", "numpy"]

[project.optional-dependencies]
dev = ["jupyter", "matplotlib", "pylatexenc"]

[tool.setuptools.packages.find]
where = ["src"]
